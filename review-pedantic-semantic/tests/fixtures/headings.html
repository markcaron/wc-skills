<!DOCTYPE html>
<html lang="en">
<head>
  <title>Heading Violations</title>
</head>
<body>
  <main>
    <!-- heading-hierarchy: skipped h2 -->
    <h1>Products</h1>
    <h3>Enterprise Linux</h3>
    <h5>Features</h5>

    <!-- one-h1-per-page: two h1s -->
    <h1>Another Main Title</h1>

    <!-- dont-style-headings-by-level -->
    <h4>This is the page subtitle</h4>

    <!-- headings-not-divs -->
    <div style="font-size: 24px; font-weight: bold;">Section Title</div>
    <p style="font-size: 20px; font-weight: bold;">Another Section</p>
  </main>
</body>
</html>
